<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Liên kết Tài liệu & Drive</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-doc: #ea4335; /* Google Docs red/orange */
            --accent-file: #0f9d58; /* Google Drive green */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-wrapper {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        #search-input {
            width: 100%;
            padding: 0.75rem 1.25rem 0.75rem 3rem;
            border: 1px solid #e5e7eb;
            border-radius: 99px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .icon-doc {
            background-color: #fef2f2;
            color: var(--accent-doc);
        }

        .icon-file {
            background-color: #ecfdf5;
            color: var(--accent-file);
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-id {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-sub);
            background-color: #f3f4f6;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            word-break: break-all;
            margin-top: auto;
        }

        .badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #f3f4f6;
            color: var(--text-sub);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-sub);
        }

        .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: center;
        }
        
        /* Tooltip for opening new tab */
        .card::after {
            content: '↗';
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s;
            color: var(--primary);
            font-size: 1.2rem;
            pointer-events: none;
        }
        
        .card:hover::after {
            opacity: 1;
        }

        @media (max-width: 640px) {
            h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

            "https://drive.google.com/file/d/1FiMBxnMK9uhTfuswMkJX1kVeCZ9I2t4x/view?usp=drive_link",
            "https://docs.google.com/document/d/16wlEkk_YZZg9z6IbOrCvWpMm0dhzMWvx/edit?usp=drive_link&ouid=106190470233562618511&rtpof=true&sd=true",
            "https://drive.google.com/file/d/1Phl1AvQ05zTKdLuZMMeXVK3GohkAqYm4/view?usp=drive_link",
            "https://docs.google.com/document/d/1_CUbRXtBqegIjQfzKNQtAJtfsUXHrHL0/edit?usp=drive_link&ouid=106190470233562618511&rtpof=true&sd=true",
            "https://drive.google.com/file/d/15TyB5kCFZrj668PMXefbP_tzLdCO6RO2/view?usp=drive_link",
            "https://docs.google.com/document/d/1EEnS_B2hMVberpjRaHJpWKDB0Q1ANHcV/edit?usp=drive_link&ouid=106190470233562618511&rtpof=true&sd=true"
        ];

        const grid = document.getElementById('links-grid');
        const searchInput = document.getElementById('search-input');
        const statsText = document.getElementById('stats-text');

        function parseUrlData(url) {
            let id = '';
            let type = 'unknown';
            let title = 'Liên kết';

            if (url.includes('/document/d/')) {
                type = 'doc';
                title = 'Google Docs';
                const match = url.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
                id = match ? match[1] : '';
            } else if (url.includes('/file/d/')) {
                type = 'file';
                title = 'Google Drive File';
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                id = match ? match[1] : '';
            } else {
                // Fallback for other links
                try {
                    const urlObj = new URL(url);
                    id = urlObj.pathname.split('/').pop() || 'N/A';
                } catch {
                    id = 'N/A';
                }
            }

            return { url, id, type, title };
        }

        function createCard(item, index) {
            const isDoc = item.type === 'doc';
            const cardClass = isDoc ? 'icon-doc' : 'icon-file';
            const svgIcon = isDoc 
                ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6C4.9 2 4.01 2.9 4.01 4L4 20C4 21.1 4.89 22 5.99 22H18C19.1 22 20 21.1 20 20V8L14 2ZM14 4.2L19.8 10H14V4.2Z"/></svg>`
                : `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V8C22 6.9 21.1 6 20 6H12L10 4Z"/></svg>`;
            const typeName = isDoc ? 'TÀI LIỆU' : 'FILE';

            const a = document.createElement('a');
            a.href = item.url;
            a.target = "_blank";
            a.className = 'card';
            a.innerHTML = `
                <div class="card-header">
                    <div class="icon-box ${cardClass}">
                        ${svgIcon}
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <div class="card-title">${item.title}</div>
                        <div style="font-size: 0.75rem; color: #6b7280; margin-top: 2px;">#${index + 1}</div>
                    </div>
                    <div class="badge">${typeName}</div>
                </div>
                <div class="card-id">${item.id}</div>
            `;
            return a;
        }

        function renderLinks(filter = '') {
            grid.innerHTML = '';
            const lowerFilter = filter.toLowerCase();
            
            let count = 0;

            rawUrls.forEach((url, index) => {
                const item = parseUrlData(url);
                
                if (lowerFilter) {
                    if (
                        !item.id.toLowerCase().includes(lowerFilter) && 
                        !item.title.toLowerCase().includes(lowerFilter) &&
                        !(index + 1).toString().includes(lowerFilter)
                    ) {
                        return;
                    }
                }

                grid.appendChild(createCard(item, index));
                count++;
            });

            if (count === 0) {
                grid.innerHTML = `<div class="empty-state">Không tìm thấy kết quả nào phù hợp với "${filter}"</div>`;
            }

            statsText.textContent = filter ? `Hiển thị ${count} kết quả` : `Hiển thị ${rawUrls.length} liên kết`;
        }

        searchInput.addEventListener('input', (e) => {
            renderLinks(e.target.value);
        });

        // Initial render
        renderLinks();

    </script>
